<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 450" width="380" height="450">
  <defs>
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#34495E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C3E50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="strapGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A252F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A252F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="interiorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="zipperGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9E9E9E;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="190" cy="430" rx="140" ry="10" fill="#000" opacity="0.2"/>
  
  <!-- Main bag body -->
  <path d="M 75 110 L 50 395 Q 50 415 65 418 L 315 418 Q 330 415 330 395 L 305 110 Z" 
        fill="url(#bagGradient)" stroke="#1A252F" stroke-width="2"/>
  
  <!-- Left side panel (depth) -->
  <path d="M 75 110 L 50 395 L 55 398 L 80 115 Z" fill="#1A252F" opacity="0.5"/>
  
  <!-- Right side panel (depth) -->
  <path d="M 305 110 L 330 395 L 325 398 L 300 115 Z" fill="#455A64" opacity="0.3"/>
  
  <!-- Interior opening (dark cavity) -->
  <ellipse cx="190" cy="110" rx="115" ry="28" fill="url(#interiorGradient)"/>
  <path d="M 75 110 Q 75 125 80 130 L 300 130 Q 305 125 305 110" fill="#0D0D0D" opacity="0.6"/>
  
  <!-- Top rim highlight -->
  <ellipse cx="190" cy="108" rx="115" ry="3" fill="#546E7A" opacity="0.7"/>
  
  <!-- Front pocket -->
  <path d="M 130 190 L 125 310 Q 125 318 132 320 L 248 320 Q 255 318 255 310 L 250 190 Z" 
        fill="#37474F" stroke="#263238" stroke-width="1.5"/>
  
  <!-- Pocket depth shadow -->
  <path d="M 130 190 L 125 310 L 128 312 L 133 192 Z" fill="#1A252F" opacity="0.4"/>
  
  <!-- Main zipper -->
  <line x1="130" y1="190" x2="250" y2="190" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"/>
  <circle cx="245" cy="190" r="6" fill="url(#zipperGradient)" stroke="#757575" stroke-width="1"/>
  <circle cx="245" cy="190" r="3" fill="#616161"/>
  
  <!-- Zipper teeth -->
  <line x1="135" y1="190" x2="240" y2="190" stroke="#757575" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Bottom reinforcement -->
  <ellipse cx="190" cy="418" rx="125" ry="6" fill="#1A252F"/>
  <ellipse cx="190" cy="416" rx="125" ry="4" fill="#263238" opacity="0.6"/>
  
  <!-- Logo/brand patch -->
  <rect x="170" y="340" width="40" height="25" rx="3" fill="#455A64" stroke="#263238" stroke-width="1"/>
  <text x="190" y="356" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#CFD8DC" text-anchor="middle">BAG</text>

  <!-- Handle on top -->
  <path d="M 155 100 Q 155 85 190 82 Q 225 85 225 100" 
        fill="none" stroke="#1A252F" stroke-width="12" stroke-linecap="round"/>
  <path d="M 155 100 Q 155 85 190 82 Q 225 85 225 100" 
        fill="none" stroke="#37474F" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Seam stitching details -->
  <line x1="75" y1="120" x2="65" y2="200" stroke="#546E7A" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.5"/>
  <line x1="305" y1="120" x2="315" y2="200" stroke="#263238" stroke-width="0.5" stroke-dasharray="2,4" opacity="0.5"/>
</svg>
